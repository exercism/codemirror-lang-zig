<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zig playground</title>
  </head>
  <body>
    <div id="editor"></div>
    <script type="module">
      import { EditorView, basicSetup } from "codemirror";
      import { indentUnit } from "@codemirror/language";
      import { zig } from "./src/index.ts";

      const doc = `//! A small Zig program
const std = @import("std");

/// A point in 2D space
const Point = struct {
    x: i32,
    y: i32 = 0,

    pub fn add(self: Point, other: Point) Point {
        return .{ .x = self.x + other.x, .y = self.y + other.y };
    }
};

const Color = enum(u8) { red, green, blue };

pub fn score(word: []const u8) !u32 {
    var total: u32 = 0;
    for (word, 0..) |c, i| {
        switch (c) {
            'a', 'e', 'i', 'o', 'u' => total += 1,
            'q', 'z' => total += 10,
            else => total += if (i % 2 == 0) 2 else 1,
        }
    }
    if (total == 0) return error.EmptyWord;
    return total;
}

test "score" {
    const p = Point{ .x = 1 };
    const message =
        \\\\Hello, "world"!
    ;
    try std.testing.expectEqual(@as(u32, 3), try score("aaa"));
    _ = p.add(.{ .x = 2, .y = -3 });
    _ = message;
    _ = 0x1F + 'x' + @intFromEnum(Color.red);
    _ = 1.5e3;
    const maybe: ?*const u8 = null;
    _ = maybe orelse undefined;
}
`;

      new EditorView({
        doc: doc,
        // Exercism uses online_editor.indent_size from the track's config.json
        extensions: [basicSetup, zig(), indentUnit.of("    ")],
        parent: document.querySelector("#editor"),
      });
    </script>
  </body>
</html>
